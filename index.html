<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0a0a0f;
  color:white;
  overflow:hidden;
}

/* glowing background */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(127,140,255,0.25), transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(181,140,255,0.2), transparent 40%),
    radial-gradient(circle at 50% 80%, rgba(127,255,212,0.15), transparent 50%);
  filter:blur(60px);
  z-index:-1;
}

.container{
  text-align:center;
  backdrop-filter:blur(10px);
  padding:40px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
}

h1{
  font-size:3.5rem;
  background:linear-gradient(90deg,#7f8cff,#b58cff,#7fffd4);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  margin-top:15px;
  color:#aaa;
}

/* loader */
.loader{
  margin:30px auto 0;
  width:50px;
  height:50px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);
  border-top:3px solid #7f8cff;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* subtle animation */
.fade{
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp 1.2s ease forwards;
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.footer{
  position:absolute;
  bottom:20px;
  font-size:0.8rem;
  color:#777;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container fade">
  <h1>Coming Soon</h1>
  <p>Something premium is on the way ⚡</p>
  <div class="loader"></div>
</div>

<div class="footer">© 2026 Aditya Mishra</div>

</body>
</html>
