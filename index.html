<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Mishra | Hub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#030305; /* Deep luxury cosmic obsidian */
  color:white;
  overflow-x:hidden;
  padding: 40px 20px;
}

/* Premium blurred mesh backdrop */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.18), transparent 50%),   /* Indigo */
    radial-gradient(circle at 90% 10%, rgba(168, 85, 247, 0.15), transparent 50%),   /* Purple */
    radial-gradient(circle at 50% 90%, rgba(45, 212, 191, 0.12), transparent 50%);   /* Mint */
  filter:blur(100px);
  z-index:-1;
}

/* Expanded layout tailored perfectly for Laptops & Desktops */
.main-wrapper{
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 35px;
}

/* Header section styled like a high-end corporate tech product launch */
.header-section{
  text-align: center;
}

h1{
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 70%, #94a3b8 100%);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom: 12px;
}

.subtitle{
  font-size: 1.1rem;
  color:#94a3b8;
  letter-spacing: 0.02em;
  font-weight: 400;
}

/* Grid layout: Adapts from 1 column on mobile to 3 columns on laptops */
.badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
  width: 100%;
}

/* Shared Premium Card Styles for absolute visual uniformity */
.premium-card {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 190px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  text-decoration: none;
  color: inherit;
  position: relative;
  overflow: hidden;
}

.premium-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(255, 255, 255, 0.15);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
              0 0 40px rgba(99, 102, 241, 0.1);
}

/* Top bar within custom cards */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.platform-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.platform-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
}

.platform-name {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.action-arrow {
  color: #64748b;
  font-size: 1.2rem;
  transition: transform 0.3s ease;
}

.premium-card:hover .action-arrow {
  transform: translateX(4px);
  color: #fff;
}

/* Identity / Handle text styling */
.user-handle {
  font-size: 1.4rem;
  font-weight: 700;
  color: #f8fafc;
  letter-spacing: -0.02em;
  margin-top: auto;
}

.user-desc {
  font-size: 0.85rem;
  color: #64748b;
  margin-top: 4px;
}

/* LinkedIn Integration Container to smoothly wrap the iframe element */
.linkedin-container {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 20px;
  padding: 12px;
  min-height: 190px;
}

/* Cinematic Entry Animation */
.fade-in{
  opacity:0;
  transform:translateY(20px);
  animation: elegantShow 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes elegantShow {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.footer{
  margin-top: 20px;
  font-size:0.75rem;
  letter-spacing: 0.06em;
  color:#334155;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="main-wrapper fade-in">
  
  <!-- Global Tech-Launch Header Section -->
  <header class="header-section">
    <h1>Aditya Mishra</h1>

  </header>

    <div class="premium-card">

          <span class="platform-name">Discord</span>

      </div>
      <div>
        <div class="user-handle">_janestreet</div>
        <div class="user-desc">Direct developer communications</div>
      </div>
    </div>

  </main>

  <footer class="footer">© 2026 Aditya Mishra • All Institutional Rights Reserved</footer>
</div>

<!-- LinkedIn platform infrastructure scripts -->
<script src="https://linkedin.com" async defer type="text/javascript"></script>
</body>
</html>
