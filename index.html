<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Mishra | AI & Full-Stack Engineer</title>

<!-- Chart.js for the Radar Skills Visualizer -->
<script src="https://jsdelivr.net"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}

html {
  scroll-behavior: smooth;
}

body{
  min-height:100vh;
  background:#020205; 
  color:#f8fafc;
  overflow-y: auto;
  padding: 120px 20px 60px;
}

.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12), transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(45, 212, 191, 0.07), transparent 50%);
  filter:blur(120px);
  z-index:-1;
}

.nav-dock {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 10px 24px;
  border-radius: 100px;
  display: flex;
  gap: 20px;
  z-index: 1000;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.nav-link {
  color: #94a3b8;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  transition: color 0.3s ease;
  letter-spacing: 0.02em;
}

.nav-link:hover {
  color: #fff;
}

.hub-wrapper {
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 100px;
}

.scroll-section {
  scroll-margin-top: 120px;
}

.main-profile-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  align-items: center;
}

@media (max-width: 768px) {
  .main-profile-grid, .analytics-container, .credentials-grid, .projects-grid {
    grid-template-columns: 1fr !important;
  }
}

.profile-pane {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.status-badge {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(45, 212, 191, 0.06);
  border: 1px solid rgba(45, 212, 191, 0.2);
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #2dd4bf;
  letter-spacing: 0.03em;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #2dd4bf;
  border-radius: 50%;
  box-shadow: 0 0 10px #2dd4bf;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

h1 {
  font-size: 3.8rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}

.headline {
  font-size: 1.2rem;
  line-height: 1.6;
  color: #94a3b8;
}

.headline strong {
  color: #f1f5f9;
}

.scroll-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  color: #475569;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.mouse-icon {
  width: 16px;
  height: 26px;
  border: 2px solid #334155;
  border-radius: 10px;
  position: relative;
}

.mouse-wheel {
  width: 4px;
  height: 6px;
  background: #2dd4bf;
  border-radius: 2px;
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  animation: scrollWheel 1.6s infinite;
}

@keyframes scrollWheel {
  0% { top: 4px; opacity: 1; }
  100% { top: 14px; opacity: 0; }
}

.stack-box {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.stack-tag {
  font-size: 0.78rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 6px 12px;
  border-radius: 8px;
  color: #cbd5e1;
  font-weight: 500;
}

.connections-pane {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.premium-card {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 18px;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.premium-card:hover {
  background: rgba(255, 255, 255, 0.03);
  border-color: rgba(99, 102, 241, 0.3);
  transform: translateX(4px);
}

.premium-card:hover .action-arrow {
  color: #fff;
  transform: translateX(4px);
}

.card-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.icon-wrapper {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
}

.platform-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #f1f5f9;
}

.platform-handle {
  font-size: 0.85rem;
  color: #64748b;
  margin-top: 2px;
}

.action-arrow {
  color: #475569;
  font-size: 1.1rem;
  transition: transform 0.3s ease, color 0.3s ease;
}

.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #f1f5f9;
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.06);
}

.credentials-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.bento-card {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 185px;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.bento-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.03);
}

.llvm-bento:hover { border-color: rgba(239, 68, 68, 0.3); }
.mdu-bento:hover { border-color: rgba(245, 158, 11, 0.3); }
.msft-bento:hover { border-color: rgba(59, 130, 246, 0.3); }
.gemini-bento:hover { border-color: rgba(168, 85, 247, 0.3); }

.bento-meta {
  font-size: 0.78rem;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.bento-heading {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.3;
  color: #f1f5f9;
  letter-spacing: -0.01em;
}

.bento-detail {
  font-size: 0.88rem;
  color: #94a3b8;
  margin-top: 12px;
}

.bento-footer-link {
  font-size: 0.82rem;
  color: #6366f1;
  font-weight: 600;
  margin-top: auto;
  padding-top: 16px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.analytics-container {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: center;
}

.radar-wrapper {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 24px;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 360px;
}

canvas {
  max-width: 100%;
  height: auto;
}

.analytics-text h3 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #f1f5f9;
  margin-bottom: 12px;
}

.analytics-text p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: #94a3b8;
  margin-bottom: 20px;
}

.filter-dock {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.filter-btn {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 8px 16px;
  border-radius: 8px;
  color: #94a3b8;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.filter-btn.active, .filter-btn:hover {
  background: rgba(99, 102, 241, 0.1);
  border-color: #6366f1;
  color: #fff;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  transition: all 0.4s ease;
}

.project-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 22px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.project-card.hidden {
  display: none !important;
}

.project-card:hover {
  transform: translateY(-6px);
  background: rgba(255, 255, 255, 0.02);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
}

.project-icon {
  width: 36px;
  height: 36px;
  background: rgba(99, 102, 241, 0.08);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #818cf8;
}

.project-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #f1f5f9;
}

.project-desc {
  font-size: 0.9rem;
  color: #94a3b8;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- Docked Navigation -->
<nav class="nav-dock">
  <a href="#profile" class="nav-link">Home</a>
  <a href="#credentials" class="nav-link">Credentials</a>
  <a href="#analytics" class="nav-link">Skills</a>
  <a href="#projects" class="nav-link">Projects</a>
</nav>

<div class="hub-wrapper">

  <!-- Profile Section -->
  <section id="profile" class="scroll-section main-profile-grid">
    <div class="profile-pane">
      <div class="status-badge">
        <div class="status-dot"></div> Available for Projects
      </div>
      <h1>Aditya Mishra</h1>
      <p class="headline"><strong>AI & Full-Stack Engineer</strong> creating scalable machine learning models and high-performance web architectures.</p>
      
      <div class="stack-box">
        <span class="stack-tag">Python</span>
        <span class="stack-tag">TypeScript</span>
        <span class="stack-tag">PyTorch</span>
        <span class="stack-tag">Next.js</span>
        <span class="stack-tag">Docker</span>
      </div>

      <div class="scroll-indicator">
