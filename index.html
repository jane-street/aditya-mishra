<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Mishra | AI & Full-Stack Engineer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}

/* FIX: Changed from height: 100vh to min-height and added scrollable overflow control */
html {
  scroll-behavior: smooth;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#030306; /* Deep obsidian space black */
  color:#f8fafc;
  overflow-y: auto; /* Restores vertical scrolling */
  padding: 80px 20px;
}

/* Luxury blurred atmospheric backdrop */
.bg{
  position:fixed; /* FIXED: Keeps background stationary while scrolling text */
  inset:0;
  background:
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12), transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(45, 212, 191, 0.08), transparent 50%);
  filter:blur(100px);
  z-index:-1;
}

/* Global Hub Layout Architecture */
.hub-wrapper {
  width: 100%;
  max-width: 1140px;
  display: flex;
  flex-direction: column;
  gap: 60px;
}

/* Upper Section Blueprint Optimized for Laptops */
.main-profile-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  align-items: center;
}

/* Left Pane: Engineering Statement & Identity */
.profile-pane {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Live Recruitment Badge */
.status-badge {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(45, 212, 191, 0.06);
  border: 1px solid rgba(45, 212, 191, 0.2);
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #2dd4bf;
  letter-spacing: 0.03em;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #2dd4bf;
  border-radius: 50%;
  box-shadow: 0 0 10px #2dd4bf;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

h1 {
  font-size: 3.5rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}

.headline {
  font-size: 1.15rem;
  line-height: 1.6;
  color: #94a3b8;
}

.headline strong {
  color: #f1f5f9;
}

/* Core Expertise Matrix Tags */
.stack-box {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.stack-tag {
  font-size: 0.78rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 6px 12px;
  border-radius: 8px;
  color: #cbd5e1;
  font-weight: 500;
}

/* Right Pane: Elite Network Action Links */
.connections-pane {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.premium-card {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 18px;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.card-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.icon-wrapper {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
}

.platform-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #f1f5f9;
}

.platform-handle {
  font-size: 0.85rem;
  color: #64748b;
  margin-top: 2px;
}

.action-arrow {
  color: #475569;
  font-size: 1.1rem;
  transition: transform 0.3s ease, color 0.3s ease;
}

/* Section Header Typography */
.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #f1f5f9;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.06);
}

/* Credentials Bento Layout Blueprint */
.credentials-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.bento-card {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 175px;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.bento-card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.03);
}

/* Specific Accent Colors on Hover */
.llvm-bento:hover { border-color: rgba(239, 68, 68, 0.3); }
.mdu-bento:hover { border-color: rgba(245, 158, 11, 0.3); }
.msft-bento:hover { border-color: rgba(59, 130, 246, 0.3); }
.gemini-bento:hover { border-color: rgba(168, 85, 247, 0.3); }

.bento-meta {
  font-size: 0.78rem;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.bento-heading {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.3;
  color: #f1f5f9;
  letter-spacing: -0.01em;
}

.bento-detail {
  font-size: 0.88rem;
  color: #94a3b8;
  margin-top: 12px;
}

.bento-footer-link {
  font-size: 0.82rem;
  color: #6366f1;
  font-weight: 600;
  margin-top: auto;
  padding-top: 16px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Interactive Radar Section Styles */
.analytics-container {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: center;
}

.radar-wrapper {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 24px;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 360px;
}

canvas {
  max-width: 100%;
  height: auto;
}

.analytics-text h3 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #f1f5f9;
  margin-bottom: 12px;
}

.analytics-text p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: #94a3b8;
  margin-bottom: 20px;
}

/* Project Showcase Architecture */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.project-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 22px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.project-card:hover {
  transform: translateY(-6px);
  background: rgba(255, 255, 255, 0.02);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
}

.project-icon {
  width: 36px;
  height: 36px;
  background: rgba(99, 102, 241, 0.08);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #818cf8;
}

.project-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #f8fafc;
  letter-spacing: -0.02em;
}

.project-desc {
  font-size: 0.95rem;
  line-height: 1.5;
  color: #94a3b8;
}

.project-tech-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}

.project-pill {
  font-size: 0.72rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 4px 10px;
  border-radius: 6px;
  color: #cbd5e1;
}

/* Hover Interactive Mechanics for Profile Cards */
.premium-card:hover { transform: translateX(6px); background: rgba(255, 255, 255, 0.03); }
.linkedin-card:hover { border-color: rgba(10, 102, 194, 0.4); }
.github-card:hover { border-color: rgba(255, 255, 255, 0.2); }
.discord-card:hover { border-color: rgba(88, 101, 242, 0.4); }
.email-card:hover { border-color: rgba(45, 212, 191, 0.4); }

.premium-card:hover .action-arrow { transform: translateX(3px); color: #ffffff; }
.premium-card:hover .icon-wrapper { background: rgba(255, 255, 255, 0.08); }
.linkedin-card:hover .icon-wrapper { color: #0a66c2; }
.github-card:hover .icon-wrapper { color: #ffffff; }
.discord-card:hover .icon-wrapper { color: #5865f2; }
.email-card:hover .icon-wrapper { color: #2dd4bf; }

/* Responsive adjustments for mobile viewports */
@media (max-width: 1024px) {
  .projects-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 992px) {
  .credentials-grid { grid-template-columns: repeat(2, 1fr); }
  .analytics-container { grid-template-columns: 1fr; gap: 30px; }
}

@media (max-width: 868px) {
  .main-profile-grid { grid-template-columns: 1fr; gap: 48px; }
  h1 { font-size: 2.8rem; }
}

@media (max-width: 640px) {
  .projects-grid { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .credentials-grid { grid-template-columns: 1fr; }
}

.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  color: #334155;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="hub-wrapper">
  
  
  <div class="main-profile-grid">
    <section class="profile-pane">
      <div class="status-badge">
        <div class="status-dot"></div>
        Seeking SWE / Full-Stack Internships
      </div>
      
      <h1>Aditya Mishra</h1>
      
      <p class="headline">
        Building high-performance web platforms by bridging the gap between <strong>full-stack software architecture</strong> and <strong>Generative AI</strong>.
      </p>

      <div class="stack-box">
        <span class="stack-tag">MERN Stack</span>
        <span class="stack-tag">Relational Databases (SQL)</span>
        <span class="stack-tag">LangChain</span>
        <span class="stack-tag">RAG Systems</span>
        <span class="stack-tag">Ollama</span>
